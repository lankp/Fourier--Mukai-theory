# Mirror of the installed workflow `.github/workflows/ci.yml`.
#
# Edit here, then paste from `name: CI` onwards into
#   https://github.com/lankp/Fourier--Mukai-theory/edit/formalization/.github/workflows/ci.yml
# The GitHub connection this project is committed through cannot write under
# `.github/workflows/` itself (it lacks the `workflows` permission), though it can
# delete files there.  Check that the two copies agree with
#
#   diff <(sed -n '/^name: CI/,$p' ci/ci.yml) .github/workflows/ci.yml
#
# State of the installed copy: the single `build-and-check` job at commit
# 36684a6, which had `lake update` removed.  This version puts it back -- it is
# what clones Mathlib, and removing it made the job 265s instead of 157s.  See
# `results/VERIFICATION.md` for the two step tables.

name: CI

# Verification setup modelled on
# https://github.com/mattrobball/BridgelandStability:
#   * a Lake build against Mathlib's olean cache (`lake exe cache get`), and
#   * an independent check of the *statements* the project claims.
#
# Both used to be separate jobs.  They are one job now: the statement check
# needs exactly the oleans the build produces, so a second job only bought a
# second `lake update` and a second Mathlib cache fetch.

on:
  push:
    # A documentation-only push does not change anything the build or the
    # statement check can see.  `results/statement-baseline.txt` is deliberately
    # NOT ignored: it is the file the statement check compares against.
    paths-ignore:
      - '**.md'
      - 'ci/**'
      - 'attachments/**'
      - 'manuscripts/**'
      - 'LICENSE'
      - 'formalization.yaml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'ci/**'
      - 'attachments/**'
      - 'manuscripts/**'
      - 'LICENSE'
      - 'formalization.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and statement check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `lake update` is kept even though `lake-manifest.json` is committed and
      # already pins the resolution.  It is not doing resolution work here: it is
      # what clones Mathlib, about 70s.  Dropping it moved that clone inside
      # `lake exe cache get`, which then cost 119s on top of the cache restore:
      # run 13 took 265s against run 12's 157s with this step present.  Measured,
      # then reverted; see results/VERIFICATION.md.
      - name: Resolve dependencies
        run: lake update


      # Two caches: the project's own oleans, and the dependency build
      # directories that `lake exe cache get` would otherwise repopulate from
      # the network.  Measured: 1.9 GB compressed together, which is the whole
      # repository's cache footprint and well inside GitHub's 10 GB budget.
      # Restoring costs about 72s and saves about 330s of compilation.  It also
      # runs before the packages exist, which is fine: `lake exe cache get`
      # fetches the sources into the restored directory tree (tested).
      - name: Restore olean cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/*/.lake/build
          key: oleans-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            oleans-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # Fast when the cache above restored: it then only checks hashes.
      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      # `#print axioms` prints even when a file has errors, so this is a build
      # step as much as an audit: it must elaborate cleanly.
      - name: Axiom audit
        run: lake env lean FourierMukai/Audit.lean

      # Exit status is 1 on any drift from results/statement-baseline.txt or on
      # any sorryAx; the printed types and axiom sets are in the log and in the
      # artifact below.
      - name: Check statements against the baseline
        run: ./scripts/check_statements.sh

      # Advisory while the tree is brought up to Mathlib's linter standard; the
      # statement check above is the blocking quality gate.
      - name: Declaration and style linters (advisory)
        continue-on-error: true
        run: |
          lake exe runLinter
          lake exe lint-style
        env:
          LAKE_NO_CACHE: "1"

      - name: Upload the re-elaborated statement surface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statement-check
          path: .scratch/statement-check.out
          if-no-files-found: ignore
          retention-days: 7
