name = "FourierMukai"
version = "0.1.0"
defaultTargets = ["FourierMukai", "WeakApprox"]
lintDriver = "batteries/runLinter"

# Mirrors the build configuration of https://github.com/AxiomMath/Stacks.
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
weak.linter.overlappingInstances = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The project builds on top of the Axiom Math formalization of the Stacks Project.
[[require]]
name = "Stacks"
git = "https://github.com/AxiomMath/Stacks"
rev = "main"

[[lean_lib]]
name = "FourierMukai"
roots = ["FourierMukai"]

[[lean_lib]]
name = "WeakApprox"
roots = ["WeakApprox"]
