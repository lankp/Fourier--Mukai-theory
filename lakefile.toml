name = "FourierMukai"
version = "0.1.0"
defaultTargets = ["FourierMukai", "WeakApprox", "StatementCheck"]
lintDriver = "batteries/runLinter"

# Lean 4.35.0, as pinned in `lean-toolchain`.  CI builds through Lake against
# Mathlib's olean cache; the development VM has a prebuilt, read-only Mathlib on
# `LEAN_PATH` and no writable package directory, so `scripts/build.sh` calls
# `lean` directly there.  Same sources, same toolchain, two entry points.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# AxiomMath/Stacks (https://github.com/AxiomMath/Stacks), pinned.  The only external
# mathematical dependency of the project (CLAUDE.md rule 2).  It is imported only by
# the two libraries below that are NOT default targets:
# * `Spaces` imports only AxiomMath's *definitions* (algebraic spaces, D_qc, Lf^*,
#   Rf_*, ⊗^L, Perf, support: ~2 000 AxiomMath modules, ~40 min to build) and takes
#   the AxiomMath *theorems* it needs as tagged inputs with their exact statements;
# * `SpacesVerified` imports the AxiomMath theorems themselves (~8 500 modules, ~6 h,
#   ~14 GB memory: see README "Building") and discharges every tagged input,
#   giving the unconditional, fully kernel-checked statements.
# The default build (`lake build`) never compiles AxiomMath.
[[require]]
name = "Stacks"
git = "https://github.com/AxiomMath/Stacks"
rev = "f56a316ddf7a930906d88b78d6f9a2668cffd0cf"

# Compiler options used by the Lake build.  `scripts/build.sh` passes the same
# three strictness options with `-D`, so the Lake path and the offline path
# elaborate identically — that is the point of having both.
#
# `autoImplicit = false` is the AxiomMath/Stacks setting and it is enforced here:
# nine modules used to rely on Lean's automatic implicit binders, and their
# binders are now declared (see `results/VERIFICATION.md` for the measurement and
# the fix).  A new module that relies on `autoImplicit` fails the build.
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
weak.linter.overlappingInstances = false

[[lean_lib]]
name = "FourierMukai"
roots = ["FourierMukai"]

[[lean_lib]]
name = "WeakApprox"
roots = ["WeakApprox"]

# The statement surface: the types and axioms of the headline results, checked
# against a recorded baseline by `scripts/check_statements.sh` independently of
# the proofs.  See `StatementCheck.lean` and `results/statement-baseline.txt`.
[[lean_lib]]
name = "StatementCheck"
roots = ["StatementCheck"]

# The algebraic-space layer on AxiomMath's definitions (not a default target).
[[lean_lib]]
name = "Spaces"
roots = ["Spaces"]

# Discharge of the tagged AxiomMath inputs by the AxiomMath theorems themselves
# (not a default target; needs the full AxiomMath build).
[[lean_lib]]
name = "SpacesVerified"
roots = ["SpacesVerified"]
