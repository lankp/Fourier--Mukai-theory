# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "FourierMukai"
  authors: [Pat Lank, Elías Guisado Villalgordo, Bregje Pauwels]
  description: >-
    A Lean 4 formalization of two papers on derived categories of algebraic spaces:
    *Gluing weak approximability along recollements* (Lank–Pauwels) and *Relative
    Fourier–Mukai theory for algebraic spaces* (Guisado Villalgordo–Lank,
    arXiv:2609.01298), in full generality, LP26 first.  The only external input is
    AxiomMath/Stacks, a pinned Lake dependency; everything else comes from Mathlib or
    is proved here.
  responsible_maintainers: [Pat Lank]
  license: "Apache-2.0"

sources:
  - title: "Relative Fourier–Mukai theory for algebraic spaces"
    authors: [Elías Guisado Villalgordo, Pat Lank]
    id: "arXiv:2609.01298"
    type: "article"
    relationship: "formalizes"
    note: >-
      Target: the current manuscript, which is newer than the arXiv posting and is
      not stored in this repository.  Proved so far: the categorical results of
      §2.1, §7 and Appendices B, C (in categorical form), Lemmas 2.25, 2.26 and 5.4
      in abstract six-functor form, Lemmas 6.11, 10.1, 10.2 over a six-functor cube,
      Lemma A.4 in the affine case.  The headline results (Theorems 1.2, 1.3, 1.6,
      1.7, 12.3, Corollary 6.18, Lemma 12.2) are being restated over algebraic
      spaces, on the `Spaces` layer (GL26 §2.2, nothing assumed).  Per-result
      status: results/COVERAGE.md.
  - title: "Gluing weak approximability along recollements"
    authors: [Pat Lank, Bregje Pauwels]
    id: "preprint, November 2026"
    type: "article"
    relationship: "formalizes"
    note: >-
      §2–§4, and Theorem 1.1 with the paper's hypotheses and nothing assumed
      (`Spaces.Stacks.theorem_1_1`).  Corollary 1.2: the affine base case
      (Neeman's weak approximability of D_{V(I)}(A-Mod), I finitely generated) is
      proved with no input; the case of qcqs algebraic spaces is in progress.

classification:
  arxiv: [math.AG, math.CT]
  msc2020: [14F08, 18G80, 14A20, 18E30]

status:
  scope: >-
    The categorical layer of both papers, the affine layer, and LP26 Theorem 1.1
    with the paper's hypotheses.  Neeman, Acta Math. 233 (2024), Theorem 3.2 is
    not assumed: what the project needs from it is proved here.  The only external
    input is AxiomMath/Stacks.
  sorry_count: 9
  sorry_in_definitions: 0
  sorry_location: >-
    All nine are in `FourierMukai/Paper/Statements.lean`: the paper's targets stated
    over a superseded abstract interface, kept as specifications and printed by
    `FourierMukai/Audit.lean`; they are to be replaced by statements over
    algebraic spaces.  No proved result depends on them.
  axioms: [propext, Classical.choice, Quot.sound]
  build: >-
    `lake exe cache get && lake build` (Lean and Mathlib v4.35.0); the
    algebraic-space layer: `lake build Spaces`; full verification against the
    AxiomMath theorems: `lake build SpacesVerified` (about 14 GB of memory).

assumptions:
  - name: "AxiomMath/Stacks"
    used_for: >-
      the only external mathematical input: definitions of algebraic spaces, D(O_X)
      on the small étale site, D_qc, Perf, Lf^*, Rf_*, the derived tensor, and the
      Stacks Project theorems the papers cite, each marked with its tag.
    in_tree: >-
      lakefile.toml (pinned Lake dependency, commit f56a316); results/AXIOMMATH_TAGS.md
      (every Stacks tag used, with its AxiomMath declaration); results/AXIOMMATH_MAP.md
      (fidelity audit of the definitions); results/STACKS_POLICY.md (policy);
      Spaces/AxiomMathInputs.lean and SpacesVerified/ (tagged inputs and their
      discharge); results/ASSUMPTIONS.md and FourierMukai/Scheme/StacksInput.lean
      (the older tagged interface of the affine layer).
